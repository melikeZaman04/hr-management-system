name: CI

on:
  pull_request:
    branches:
      - main
      - feature/**
  push:
    branches:
      - main

jobs:
  lint-and-build:
    name: Lint ve Build
    runs-on: ubuntu-latest

    steps:
      - name: Kodu checkout et
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: ESLint kontrolü
        run: npm run lint

      - name: Production build
        run: npm run build
